<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Оракул</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #070514;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        /* Живой неоновый бэкграунд */
        .glow-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,127,0.4) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }
        .glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(127,0,255,0.4) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
        }
        .container {
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8a8aa8;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        .sphere-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        /* Фиолетовая 3D сфера */
        .magic-sphere {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 35% 35%, #d8b4fe, #7c3aed, #2e1065, #000000);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.5), 
                        inset -15px -15px 30px rgba(0,0,0,0.7), 
                        inset 15px 15px 25px rgba(255,255,255,0.25);
            cursor: pointer;
            animation: float 5s ease-in-out infinite;
            transition: transform 0.2s ease;
        }
        .magic-sphere:active {
            transform: scale(0.92);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        /* Экран с результатом */
        .result-box {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 30px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }
        .prediction-text {
            font-size: 17px;
            line-height: 1.6;
            color: #f3f4f6;
            font-weight: 500;
        }
        .action-btn {
            background: #ffffff;
            color: #070514;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255,255,255,0.15);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div id="startScreen">
            <h1>Космический Оракул</h1>
            <p class="subtitle">Сконцентрируйся на вопросе и коснись сферы, чтобы активировать портал</p>
            <div class="sphere-container">
                <div class="magic-sphere" onclick="generatePrediction()"></div>
            </div>
        </div>

        <div class="result-box" id="resultScreen">
            <h1>Послание получено</h1>
            <p class="subtitle">Вселенная сформировала ответ на твой запрос</p>
            <div class="card">
                <p class="prediction-text" id="predictionText"></p>
            </div>
            <button class="action-btn" onclick="resetApp()">Вернуться в космос</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Открывает приложение на всю высоту телефона

        const answers = [
            "Твоя внутренняя энергия сейчас на пике. Идеальный момент, чтобы сделать первый шаг в том, что ты постоянно откладываешь.",
            "Замедли свой бег. Ответ, который ты ищешь, лежит на поверхности, но суета мешает его разглядеть. Побудь в тишине.",
            "Вектор твоей финансовой энергии меняет направление. Будь готов заметить скрытые возможности в ближайшие 48 часов.",
            "Кто-то прямо сейчас думает о тебе с сильной ментальной поддержкой. Твои действия одобряются свыше, продолжай.",
            "Препятствие, с которым ты столкнулся — это не тупик. Это фильтр, который отсекает лишнее. Перешагни через него.",
            "Доверься случайностям на этой неделе. Незапланированная встреча или спонтанное решение принесут мощный прорыв."
        ];

        function generatePrediction() {
            // Вибрация смартфона при клике через встроенный TG Haptic Feedback
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            document.getElementById('startScreen').style.display = 'none';
            
            const randomIdx = Math.floor(Math.random() * answers.length);
            document.getElementById('predictionText').innerText = answers[randomIdx];
            
            document.getElementById('resultScreen').style.display = 'block';
        }

        function resetApp() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
        }
    </script>
</body>
</html>
